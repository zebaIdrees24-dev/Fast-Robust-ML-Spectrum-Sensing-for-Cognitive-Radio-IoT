[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cr-iot-fast-robust-ml"
version = "0.1.0"
description = "Fast robust spectrum sensing and ML experiments for cognitive-radio IoT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "scikit-learn>=1.3", "joblib>=1.3", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
plot = ["matplotlib>=3.8"]

[project.scripts]
cr-iot-sensing = "cr_iot_sensing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

